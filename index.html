
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #164e63);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      margin: 20px;
      padding: 30px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      color: #67e8f9;
    }

    button {
      background: #67e8f9;
      color: #101827;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>नमस्ते दोस्तों! 👋</h1>
    <p>यह मेरी पहली वेबसाइट है।</p>

    <button onclick="alert('मेरी वेबसाइट काम कर रही है!')">
      यहाँ क्लिक करें
    </button>
  </div>
</body>
</html>
